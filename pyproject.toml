[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deik-robotgoalkeeper"
version = "1.0.0"
description = "DEIK Robot Goalkeeper - Real-time optical ball tracking, 3D trajectory prediction, and robot goalkeeper control system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Roland Morvai", email = "morvai.roland@mailbox.unideb.hu" },
    { name = "Donát Rácz" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
