# =============================================================================
# DEIK Robot Foci Kapus – Fő Konfiguráció
# =============================================================================
#
# Ez a fájl tartalmazza az összes rendszerparamétert.
# Szerkesztés előtt olvasd el a megjegyzéseket!
#
# KOORDINÁTA-RENDSZER:
#   Origó: a kapu közepének talajon lévő pontja
#   X tengely: vízszintes (bal → jobb pozitív)  [mm]
#   Y tengely: függőleges (talaj → felfelé pozitív)  [mm]
#   Z tengely: mélység (kapu → pályára pozitív)  [mm]
#
# GEOMETRIA:
#   Bal kamera:  X = -1150 mm, Y = 2800 mm, Z = 0 mm
#   Jobb kamera: X = +1150 mm, Y = 2800 mm, Z = 0 mm
#   Kapu: X = [-2000, +2000] mm, Y = [0, 2000] mm, Z = 0 mm
#   Baseline (kamerák közötti táv): 2300 mm
#   Lövőtávolság: Z = 10000 mm
# =============================================================================


# =============================================================================
# Kamera konfiguráció
# =============================================================================
camera:
  # Kamera típusa: "ximea" | "mock" | "webcam"
  # "mock"   → webcam vagy videófájl (fejlesztéshez/teszteléshez)
  # "ximea"  → valódi Ximea MC023CG-SY-UB kamerák
  type: "ximea"

  # Natív képfelbontás (Sony IMX174: 1936 × 1216)
  resolution:
    width: 1936
    height: 1216

  # Célzott frame rate (a kamera max. 165 FPS-t tud)
  # Javasolt: 100 FPS – gyors mozgáshoz elegendő, USB sávszélesség stabil
  fps: 100

  # Zársebesség mikroszekundumban (1/fps * 1e6 a max mozgásblur nélkül)
  # 100 FPS-nél: max 10000 µs; javasolt: 2000-5000 µs erős megvilágításnál
  exposure_time_us: 3000

  # Erősítés dB-ben (0.0 = erősítés nélkül)
  # Csak gyenge fényviszonyoknál növeld!
  gain_db: 0.0

  # Ximea USB3 sávszélesség-kezelés.
  # FONTOS: a xiAPI Mbit/s-ban (nem MB/s-ban) értelmezi a limitet.
  # "unlimited": kikapcsolja a mesterséges limitet. Ezt CSAK akkor használd,
  # ha a két kamera külön "5000M" USB root hub / vezérlő alatt van.
  # "limited": közös USB vezérlőn a limit_mbps értékkel szabályoz.
  bandwidth_mode: "unlimited"
  bandwidth_limit_mbps: null

  # Ximea gyári sorozatszámok (visszafelé kompatibilitás)
  serial_number_left: "CACAU2546000"
  serial_number_right: "CACAU2517001"

  # Alapértelmezett fehéregyensúly és elforgatás (0° = Vízszintes / Landscape)
  auto_white_balance: true
  wb_kr: 1.8   # Piros erősítés (ha auto_white_balance: false)
  wb_kg: 1.0   # Zöld erősítés
  wb_kb: 2.1   # Kék erősítés
  rotation: 0  # Elforgatás fokban (0, 90, 180, 270) – Landscape mód = 0

  # ----- Egyedi beállítások a BAL kamerára -----
  left:
    serial_number: "CACAU2546000"
    exposure_time_us: 3000
    gain_db: 0.0
    auto_white_balance: true
    wb_kr: 1.8
    wb_kg: 1.0
    wb_kb: 2.1
    rotation: 0  # Landscape mód – kamerák vízszintesen szerelve

  # ----- Egyedi beállítások a JOBB kamerára -----
  right:
    serial_number: "CACAU2517001"
    exposure_time_us: 3000
    gain_db: 0.0
    auto_white_balance: true
    wb_kr: 1.8
    wb_kg: 1.0
    wb_kb: 2.1
    rotation: 0  # Landscape mód – kamerák vízszintesen szerelve

  # Mock kamera videófájlok (csak type="mock" esetén)
  mock:
    left_source: 0           # 0 = alapértelmezett webcam, vagy videófájl elérési út
    right_source: 1          # 1 = második webcam
    loop_video: true         # Videófájlok ismétlése


# =============================================================================
# Kamera geometria és optika
# =============================================================================
geometry:
  # ----- Lencse: Fujifilm CF8ZA-1S -----
  # Nominális fókusztávolság: 8 mm
  focal_length_mm: 8.0

  # Tényleges fókuszpont pixelben:
  #   f_px = f_mm / pixel_size_mm
  #   f_px = 8.0 / 0.00586 = 1365.2 px
  # FIGYELEM: A pontos értéket a sztereó kalibrálás adja meg!
  #           Ez csak egy becsült kezdőérték.
  focal_length_px: 1365.2

  # Szenzor pixel mérete (Sony IMX174): 5.86 µm
  pixel_size_um: 5.86

  # Szenzor fizikai mérete (mm)
  sensor_width_mm: 11.345     # = 1936 × 5.86 µm
  sensor_height_mm: 7.127     # = 1216 × 5.86 µm

  # Képközéppont (principal point) – ideális esetben a szenzor közepe
  # FIGYELEM: A pontos értéket a kalibrálás adja meg!
  principal_point_x: 968.0    # = 1936 / 2
  principal_point_y: 608.0    # = 1216 / 2

  # ----- Sztereó elrendezés (fizikailag mért értékek) -----
  # Bal kamera: kapu közepétől -1150 mm (baseline/2 = 2300/2 = 1150 mm)
  left_camera_x_mm: -1150.0
  # Jobb kamera: kapu közepétől +1150 mm
  right_camera_x_mm: 1150.0

  # Baseline = a két kamera közötti vízszintes távolság (mérve: 230 cm)
  baseline_mm: 2300.0

  # Kamerák magassága a talajtól (mérve: 280 cm)
  camera_height_mm: 2800.0

  # Kamerák Z pozíciója (kapu síkjától mért távolság)
  # Negatív: gólvonal mögött (azaz a kapu belsejében), +Z a pálya felé mutat
  # A kamerák 900mm-rel vannak a gólvonal mögött
  camera_z_offset_mm: -900.0

  # ----- Kapu mérete -----
  goal_width_mm: 4000.0       # 4 méter széles
  goal_height_mm: 2000.0      # 2 méter magas

  # ----- Pálya -----
  # A lövő helye (ahol a labdát rúgják)
  shooting_distance_mm: 10000.0  # 10 méter a kaputól


# =============================================================================
# Sztereó kalibrálás
# =============================================================================
stereo:
  # Kalibrálási adatok mentési helye
  calibration_file: "data/calibration/stereo_calibration.npz"

  # Kalibráláshoz használt sakktábla paraméterei
  # A nyomtatott tábla: 12×9 négyzet → OpenCV belső sarokpontok: 11×8
  # (belső sarkok száma = négyzetek száma - 1 per tengely)
  chessboard:
    inner_corners_x: 11     # Vízszintes belső sarokpontok száma (12 négyzet - 1)
    inner_corners_y: 8      # Függőleges belső sarokpontok száma (9 négyzet - 1)
    square_size_mm: 70.0    # Sakktábla négyzetének fizikai mérete mm-ben (7 cm)

  # Minimum szükséges kalibrálási képpár (pontossághoz min. 20 ajánlott)
  min_calibration_frames: 20

  # Kalibrálás minőségi küszöb (RMSE pixelben)
  # Ha az újrakalibrálási hiba nagyobb ennél, figyelmeztetést kapunk
  max_acceptable_rmse_px: 1.0


# =============================================================================
# Labda fizikai paraméterek
# =============================================================================
ball:
  # Labda típusa (referencia)
  type: "kipsta_size4_orange"

  # 4-es méretű labda: ~210mm átmérő, ~340g tömeg
  # (5-ös méret: 220mm / 430g)
  diameter_mm: 210
  mass_kg: 0.340

  # Gömb légellenállási koefficiense (dimenzió nélküli)
  drag_coefficient: 0.47

  # ----- HSV + alak ellenőrző (narancssárga labda) -----
  # OpenCV HSV-ben a narancssárga labda jellemzően H=5..25. A szigorú validáció
  # minden RT-DETR találatra lefut, ezért más „sports ball” objektum nem kap
  # zöld jelölést, ha nem megfelelően narancssárga és közel kör alakú.
  hsv_filter:
    enabled: true
    h_min: 5       # Narancssárga hue alsó határ (OpenCV: 0-180)
    h_max: 25      # Narancssárga hue felső határ
    s_min: 110     # A szürke/fehér tárgyak kizárása
    s_max: 255
    v_min: 100     # Sötét háttér és árnyék kizárása
    v_max: 255
    min_color_ratio: 0.20       # A detektált doboz legalább 20%-a legyen narancssárga
    min_circularity: 0.55       # Mozgáselmosódást még engedő köralakúság
    min_aspect_ratio: 0.60      # BBox szélesség / magasság
    max_aspect_ratio: 1.55
    max_colored_blob_ratio: 0.90  # Teli narancssárga négyzet/tábla kizárása


# =============================================================================
# Labdadetektálás
# =============================================================================
detection:
  # ----- Modell Választás -----
  # "models/rtdetr-l.engine" → RT-DETR Large TensorRT GPU motor
  model_path: "models/rtdetr-l.engine"

  # COCO modell osztály ID: 32 (sports ball)
  ball_class_id: 32

  # Detektálási megbízhatósági küszöb (0.0 – 1.0)
  confidence_threshold: 0.20

  # IoU küszöb NMS-hez
  iou_threshold: 0.45

  # Inferencia bemeneti méret
  input_size: 640

  # Inferencia eszköz: "cuda:0" = GPU (RTX 3050), "cpu" = processzor
  device: "cuda:0"

  # ByteTrack konfiguráció (automatikus multi-object tracking)
  # KIKAPCSOLVA: model.track() stateful trackinget futtat és jelentős overhead-et okoz.
  # A 2D Kalman szűrő (kalman szekció lent) már elvégzi a simítást – ByteTrack felesleges.
  tracking:
    enabled: false
    tracker_config: "bytetrack.yaml"
    max_lost_frames: 15

  # Gyors pálya: a két kamerán talált, szigorúan narancssárga és kör alakú
  # objektumot közvetlenül követjük. Minden 8. képen RT-DETR újraellenőriz,
  # illetve azonnal visszaesünk rá, ha csak az egyik kamerán van találat.
  fast_color_tracker:
    enabled: true
    recheck_every_n_frames: 8

  # ----- Kalman szűrő (2D per-camera simítás) -----
  kalman:
    enabled: true
    # Folyamaterrör (minél nagyobb, annál érzékenyebb az új mérésekre)
    # 0.05: gyorsabban követi a labda hirtelen irányváltozásait
    process_noise: 0.05
    # Mérési zaj (minél nagyobb, annál inkább bíz a predikciós modellben)
    # 0.05: jobban bízunk a YOLO mérésben (kevesebb simítás)
    measurement_noise: 0.05
    # Ennyi frame nélküli detektálás után nullázzuk a szűrőt
    # 5: gyorsabb újradetektálás elvesztett labda esetén
    max_coast_frames: 5
    # A zöld jelölés legfeljebb ennyivel vetíthető előre a GUI képre.
    display_prediction_horizon_s: 0.15

  # ----- Region of Interest (ROI) -----
  # Opcionális kép-terület szűrés. A kapus rendszernél kikapcsolva (enabled: false),
  # hogy a magasra lőtt/dobott (levegőben szálló) labdák is 100%-ban láthatóak legyenek.
  roi:
    enabled: false   # Kikapcsolva, hogy a levegőben lévő labdákat ne vágja le!
    # ROI koordináták (relatív, 0.0 – 1.0)
    x_min_rel: 0.0
    x_max_rel: 1.0
    y_min_rel: 0.0   # Teljes vertikális tartomány (0% = a kép legteteje)
    y_max_rel: 1.0   # (100% = a kép legalja)


# =============================================================================
# Trajektória előrejelzés
# =============================================================================
prediction:
  # Gravitáció (mm/s²) – Föld felszínén 9810 mm/s²
  gravity_mm_s2: 9810.0

  # Légellenállás koefficiense (dimenzió nélküli, 0 = nincs ellenállás)
  # 4-es Kipsta focilabda: kisebb és könnyebb, nagyobb drag/tömeg arány
  drag_coefficient: 0.0005

  # A Z=0 síkban (kapuvonalon) prediktáljuk az impact-pontot
  goal_plane_z_mm: 0.0

  # Minimum detektálási pontok száma a predikció előtt
  # (legalább N mérés kell a sebesség meghatározásához)
  min_points_for_prediction: 3

  # Trajektória történelem mérete (ennyi pontot tartunk meg)
  trajectory_history_size: 30

  # Predikciós megbízhatóság küszöb (ez alá nem mutatjuk a predikciót)
  min_confidence_threshold: 0.25

  # 3D Kalman szűrő trajektória simításhoz
  kalman_3d:
    process_noise: 1.0
    measurement_noise: 5.0   # mm-es mérési bizonytalanság


# =============================================================================
# GUI megjelenítés
# =============================================================================
gui:
  # Ablak cím
  window_title: "DEIK Robot Foci Kapus – Vizualizációs Rendszer"

  # Alapértelmezett téma: "dark" | "light"
  theme: "dark"

  # GUI frissítési ráta (FPS) – monitorhoz korlátozzuk
  gui_fps_limit: 60

  # Kamera nézet bélyegkép mérete (a natív felbontás lekicsinyítve)
  camera_display_width: 960
  camera_display_height: 600

  # Overlay megjelenítési beállítások
  overlay:
    show_detection_box: true      # YOLO detektálási doboz
    show_ball_center: true        # Labda középpontja
    show_trajectory: true         # 2D trajektória overlay
    show_confidence: true         # Konfidencia érték
    show_tracking_id: true        # ByteTrack ID
    show_fps_counter: true        # FPS számláló
    show_3d_position: true        # 3D pozíció felirat

  # Kapu vizualizátor beállítások
  goal_view:
    show_impact_prediction: true  # Becsapódási pont
    show_shot_history: true       # Korábbi lövések
    max_shot_history: 15          # Maximum megőrzött lövés


# =============================================================================
# Naplózás (logging)
# =============================================================================
logging:
  # Napló szintje: "DEBUG" | "INFO" | "WARNING" | "ERROR"
  level: "INFO"

  # Napló fájl elérési útja (null = csak konzol)
  log_file: "data/goalkeeper.log"

  # Maximum napló fájl méret (MB)
  max_log_size_mb: 50

  # Megőrzött backup napló fájlok száma
  backup_count: 3
