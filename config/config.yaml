# =============================================================================
# DEIK Robot Foci Kapus – Fő Konfiguráció
# =============================================================================
#
# Ez a fájl tartalmazza az összes rendszerparamétert.
# Szerkesztés előtt olvasd el a megjegyzéseket!
#
# KOORDINÁTA-RENDSZER:
#   Origó: a kapu közepének talajon lévő pontja
#   X tengely: vízszintes (bal → jobb pozitív)  [mm]
#   Y tengely: függőleges (talaj → felfelé pozitív)  [mm]
#   Z tengely: mélység (kapu → pályára pozitív)  [mm]
#
# GEOMETRIA:
#   Bal kamera:  X = -1100 mm, Y = 2900 mm, Z = 0 mm
#   Jobb kamera: X = +1100 mm, Y = 2900 mm, Z = 0 mm
#   Kapu: X = [-2000, +2000] mm, Y = [0, 2000] mm, Z = 0 mm
#   Baseline (kamerák közötti táv): 2200 mm
#   Lövőtávolság: Z = 10000 mm
# =============================================================================


# =============================================================================
# Kamera konfiguráció
# =============================================================================
camera:
  # Kamera típusa: "ximea" | "mock" | "webcam"
  # "mock"   → webcam vagy videófájl (fejlesztéshez/teszteléshez)
  # "ximea"  → valódi Ximea MC023CG-SY-UB kamerák
  type: "ximea"

  # Natív képfelbontás (Sony IMX174: 1936 × 1216)
  resolution:
    width: 1816
    height: 1216

  # Célzott frame rate (a kamera max. 165 FPS-t tud)
  # Javasolt: 100 FPS – gyors mozgáshoz elegendő, USB sávszélesség stabil
  fps: 60

  # Zársebesség mikroszekundumban (1/fps * 1e6 a max mozgásblur nélkül)
  # 100 FPS-nél: max 10000 µs; javasolt: 2000-5000 µs erős megvilágításnál
  exposure_time_us: 3000

  # Erősítés dB-ben (0.0 = erősítés nélkül)
  # Csak gyenge fényviszonyoknál növeld!
  gain_db: 0.0

  # Ximea USB3 sávszélesség-kezelés.
  # FONTOS: a xiAPI Mbit/s-ban (nem MB/s-ban) értelmezi a limitet.
  # "unlimited": kikapcsolja a mesterséges limitet. Ezt CSAK akkor használd,
  # ha a két kamera külön "5000M" USB root hub / vezérlő alatt van.
  # "limited": közös USB vezérlőn a limit_mbps értékkel szabályoz.
  bandwidth_mode: "unlimited"
  bandwidth_limit_mbps: null

  # Ximea gyári sorozatszámok (visszafelé kompatibilitás)
  serial_number_left: "CACAU2546000"
  serial_number_right: "CACAU2517001"

  # Alapértelmezett fehéregyensúly (White Balance)
  auto_white_balance: true
  wb_kr: 1.8   # Piros erősítés (ha auto_white_balance: false)
  wb_kg: 1.0   # Zöld erősítés
  wb_kb: 2.1   # Kék erősítés

  # ----- Egyedi beállítások a BAL kamerára -----
  left:
    serial_number: "CACAU2546000"
    exposure_time_us: 3000
    gain_db: 0.0
    auto_white_balance: true
    wb_kr: 1.8
    wb_kg: 1.0
    wb_kb: 2.1

  # ----- Egyedi beállítások a JOBB kamerára -----
  right:
    serial_number: "CACAU2517001"
    exposure_time_us: 3000
    gain_db: 0.0
    auto_white_balance: true
    wb_kr: 1.8
    wb_kg: 1.0
    wb_kb: 2.1

  # =============================================================================
  # Hardveres GPIO szinkronizáció (CBL-702-8P-SYNC-5M0 kábel)
  # =============================================================================
  #
  # 1. EGYSZERŰ NEM IZOLÁLT MÓD (3.3V LVTTL - Közvetlen bekötés, külső táp NÉLKÜL):
  #    - Nem igényel külső tápegységet, a kamerák belső 3.3V LVTTL logikáját használja.
  #    - Két kábel szabad éreinek összekötése:
  #        JOBB MASTER Pin 8 (Piros / INOUT1) ──── BAL SLAVE Pin 8 (Piros / INOUT1)
  #        JOBB MASTER Pin 7 (Kék / GND)       ──── BAL SLAVE Pin 7 (Kék / GND)
  #    - A fennmaradó 6-6 eret (Fehér, Barna, Zöld, Sárga, Szürke, Rózsaszín)
  #      szigetelni kell, hogy ne érjenek semmihez!
  #
  # 2. OPTO-IZOLÁLT MÓD (+5V külső tápegységgel - galvanikusan leválasztott):
  #    - MASTER Pin 3 (Zöld / OUT1) Open Collector.
  #        +5V ──────── SLAVE Pin 5 (Szürke / IN1)
  #        SLAVE Pin 6 (Rózsaszín / IN-GND) ──── MASTER Pin 3 (Zöld / OUT1)
  #        GND (5V -) ───────────────────────── MASTER Pin 4 (Sárga / OUT-GND)
  #        MASTER Pin 7 (Kék / GND) ──────────── SLAVE Pin 7 (Kék / GND)
  #
  # EREDMÉNY: <10 µs szinkron jitter (vs. szoftver szinkron ~2 ms jitter)
  sync:
    enabled: true  # true = HW GPIO trigger | false = szoftver szinkron
    master_side: "right"    # "right" = jobb kamera a MASTER (serial: CACAU2517001)
                            # "left"  = bal kamera a MASTER (serial: CACAU2546000)
    # --- MASTER kamera GPIO kimenet (Opto-izolalt, Pin 3 / Zold / OUT1 = PORT1) ---
    # XI_GPO_PORT1 = Pin 3 (Zold/OUT1) – Open Collector opto-izolalt kimenet
    # FONTOS: Open Collector – nem izolalt modnal a ket 4k7 soros ellenallas
    # leranta a feszultseget (1.2V < 1.3V kuszob) → csak opto-izolalt modban mukodik!
    gpo_selector: "XI_GPO_PORT1"           # Pin 3 (Zold/OUT1) – opto kimenet
    gpo_mode: "XI_GPO_EXPOSURE_ACTIVE"     # Pulzust ad ki az expozicio TELJES ideje alatt
    # --- SLAVE kamera GPIO bemenet (Opto-izolalt, Pin 5 / Szurke / IN1 = PORT1) ---
    # XI_GPI_PORT1 = Pin 5 (Szurke/IN1) – Opto-izolalt bemenet (4-24V high kuszob)
    # Bekotek: MASTER Pin3 (Zold)→SLAVE Pin5 (Szurke), MASTER Pin4 (Sarga)→SLAVE Pin6 (Rozsaszin)
    gpi_selector: "XI_GPI_PORT1"           # Pin 5 (Szurke/IN1) – opto bemenet
    gpi_mode: "XI_GPI_TRIGGER"             # Trigger bemeneti mod
    trigger_source: "XI_TRG_EDGE_RISING"   # Emelkedo elre triggerel
    # --- Fallback ---
    fallback_to_software_sync: false        # true = visszaeses szoftver szinkronra ha nincs trigger jel



  # Mock kamera videófájlok (csak type="mock" esetén)
  mock:
    left_source: 0           # 0 = alapértelmezett webcam, vagy videófájl elérési út
    right_source: 1          # 1 = második webcam
    loop_video: true         # Videófájlok ismétlése


# =============================================================================
# Kamera geometria és optika
# =============================================================================
geometry:
  # ----- Lencse: Fujifilm CF8ZA-1S -----
  # Nominális fókusztávolság: 8 mm
  focal_length_mm: 8.0

  # Tényleges fókuszpont pixelben:
  #   f_px = f_mm / pixel_size_mm
  #   f_px = 8.0 / 0.00586 = 1365.2 px
  # FIGYELEM: A pontos értéket a sztereó kalibrálás adja meg!
  #           Ez csak egy becsült kezdőérték.
  focal_length_px: 1365.2

  # Szenzor pixel mérete (Sony IMX174): 5.86 µm
  pixel_size_um: 5.86

  # Szenzor fizikai mérete (mm)
  sensor_width_mm: 11.345     # = 1936 × 5.86 µm
  sensor_height_mm: 7.127     # = 1216 × 5.86 µm

  # Képközéppont (principal point) – placeholder a beállított felbontás közepén.
  # FIGYELEM: A pontos értéket a sztereó kalibrálás (K1/K2) adja meg és felülírja!
  #           Ez csak a kalibrálás előtti / mono-fallback becsléshez használt kezdőérték.
  principal_point_x: 844.0    # = 1688 / 2 (beállított szélesség)
  principal_point_y: 608.0    # = 1216 / 2 (beállított magasság)

  # =========================================================================
  # VILÁG-GEOMETRIA (config-alapú TARTALÉK)
  # -------------------------------------------------------------------------
  # Az alábbi 5 paraméter CSAK akkor van használatban, ha a
  # data/calibration/stereo_calibration.npz NEM tartalmaz kalibrált merev
  # világ-transzformációt (R_world_cam / t_world_cam).
  #
  # A PONTOS X/Y/Z-hez futtasd a talajsík-kalibrálót ismert pontokból:
  #     python scripts/calibrate_world.py --template points.json   # sablon
  #     python scripts/calibrate_world.py --points   points.json   # illesztés + mentés
  # Ez felülírja a lenti közelítő értékeket egy mért, merev transzformációval,
  # így a talajon lévő labda tényleg Y≈0-t ad, és a mélység nem "billenti" a magasságot.
  # =========================================================================

  # ----- Sztereó elrendezés (fizikailag mért értékek) -----
  # Bal kamera: bal kapufától 930mm jobbra (kapu közepétől: -2000+930 = -1070mm)
  left_camera_x_mm: -1050.0
  # Jobb kamera: jobb kapufától 930mm balra (kapu közepétől: +2000-930 = +1070mm)
  right_camera_x_mm: 1050.0

  # Baseline = a két kamera közötti távolság. FONTOS: a tényleges geometriát a
  # stereo_calibration.npz T vektora adja (kb. 2369 mm); ez itt csak kalibrálás
  # előtti becslés/fallback.
  baseline_mm: 2200.0

  # Kamerák magassága a talajtól [mm] (tartalék world-transzformációhoz).
  camera_height_mm: 2700.0

  # A kamera Z pozíciója a kapu-koordináta-rendszerben (gólvonal = 0, +Z a pálya felé).
  # A képlet: z_goal = z_fwd + camera_z_offset_mm, tehát ez a kamera Z koordinátája.
  # A kamerák a gólvonaltól ~1,2 méterre HÁTRA vannak -> negatív érték.
  camera_z_offset_mm: -1200.0

  # Kamerák lefelé dőlési szöge fokban (Pitch angle) – a KAMERA OPTIKAI TENGELYÉNEK
  # tényleges dőlése (nem a konzol beállított szöge). Csak a config-alapú tartalék
  # world-transzformáció használja. A talajon lévő labda Y≈0 feltétele a pitch ÉS a
  # camera_height_mm együttes helyességétől függ – ezért ajánlott a calibrate_world.py.
  camera_pitch_deg: 29

  # ----- Kapu mérete -----
  goal_width_mm: 4000.0       # 4 méter széles
  goal_height_mm: 2000.0      # 2 méter magas
  # A becsapódás-predikció a labda KÖZÉPPONTJÁT vizsgálja a "kapun belül" döntésnél.
  # A labda sugara (~105 mm) + mérési/extrapolációs zaj miatt ennyi tűréssel engedjük
  # be a kereten (kapufák/talaj/keresztléc) kívülre eső középpontokat is, különben
  # egy súroló/talajon guruló, ténylegesen kapuba tartó lövés Y≈0-nál (vagy egy
  # kapufa mellett) hamis negatívnak (in_goal=False) számítana.
  goal_margin_mm: 150.0

  # ----- Pálya -----
  # A lövő helye (ahol a labdát rúgják)
  shooting_distance_mm: 10000.0  # 10 méter a kaputól


# =============================================================================
# Sztereó kalibrálás
# =============================================================================
stereo:
  # Kalibrálási adatok mentési helye
  calibration_file: "data/calibration/stereo_calibration.npz"

  # Kalibráláshoz használt kalibrációs tábla paraméterei
  # Jelenlegi tábla: 12×9 ChArUco tábla (A1 méret, laminált)
  #   Négyzet méret: 65 mm (6.5 cm)
  #   Marker méret:  50 mm (5.0 cm)
  #   Szótár:        DICT_6X6_250
  chessboard:
    # Tábla típusa: "chessboard" (hagyományos sakktábla) | "charuco" (ChArUco hibrid)
    board_type: "charuco"

    # Tábla méret (négyzetek száma, NEM belső sarkok!)
    # 12×9 ChArUco → cols=12, rows=9
    cols: 12                # Vízszintes négyzetek száma
    rows: 9                 # Függőleges négyzetek száma

    # Visszafelé kompatibilitás: inner_corners = cols-1, rows-1
    inner_corners_x: 11     # cols - 1  (csak chessboard módban használt)
    inner_corners_y: 8      # rows - 1  (csak chessboard módban használt)

    # Fizikai méretek
    square_size_mm: 65.0    # Négyzet mérete mm-ben (6.5 cm)
    marker_size_mm: 50.0    # ArUco marker mérete mm-ben (5.0 cm) – csak ChArUco

    # ArUco szótár típusa – csak ChArUco módban
    # Lehetséges értékek: DICT_4X4_50 | DICT_4X4_100 | DICT_4X4_250 | DICT_4X4_1000
    #                     DICT_5X5_50 | DICT_5X5_100 | DICT_5X5_250 | DICT_5X5_1000
    #                     DICT_6X6_50 | DICT_6X6_100 | DICT_6X6_250 | DICT_6X6_1000
    aruco_dict: "DICT_6X6_250"

  # Minimum szükséges kalibrálási képpár (pontossághoz min. 20 ajánlott)
  min_calibration_frames: 20

  # Kalibrálás minőségi küszöb (RMSE pixelben)
  # Ha az újrakalibrálási hiba nagyobb ennél, figyelmeztetést kapunk
  max_acceptable_rmse_px: 1.0


# =============================================================================
# Labda fizikai paraméterek
# =============================================================================
ball:
  # Labda típusa (referencia)
  type: "kipsta_size4_orange"

  # 4-es méretű labda: ~210mm átmérő, ~340g tömeg
  # (5-ös méret: 220mm / 430g)
  diameter_mm: 210
  mass_kg: 0.340

  # Gömb légellenállási koefficiense (dimenzió nélküli)
  drag_coefficient: 0.47

  # ----- HSV szín-ellenőrző (narancssárga Kipsta labda) -----
  # Finomhangolva a fehér mintás Kipsta labdához:
  # s_min=75 és min_orange_ratio=0.08 (8%) úgy lett beállítva, hogy a labdán lévő
  # fehér feliratok ("KIPSTA") és grafikák se okozzanak elutasítást!
  hsv_filter:
    enabled: true
    h_min: 5       # Narancssárga hue alsó határ (OpenCV: 0-180)
    h_max: 25      # Narancssárga hue felső határ
    s_min: 75      # Finomhangolt szaturáció (átengedi a fehér mintás labdát is)
    s_max: 255
    v_min: 60      # Minimum világosság
    v_max: 255
    min_orange_ratio: 0.08   # A labda területének legalább 8%-a narancssárga legyen
    
    # --- Dinamikus ROI optimalizálás a HSV fallback-hez ---
    dynamic_roi_enabled: true
    dynamic_roi_size_px: 300       # Keresési ablak mérete az utolsó pozíció körül (300x300 pixel)
    dynamic_roi_timeout_frames: 5  # Hány frame után essünk vissza teljes képre, ha nincs meg


# =============================================================================
# Labdadetektálás
# =============================================================================
detection:
  # ----- Modell Választás -----
  # "models/rtdetr-l.engine" → Real-Time Detection Transformer (RT-DETR) TensorRT batch=2 GPU modell
  model_path: "models/yolov8n.engine"

  # COCO modell osztály ID: 32 (sports ball)
  ball_class_id: 32

  # Detektálási megbízhatósági küszöb (0.0 – 1.0)
  # 0.15: Érzékeny beállítás, hogy a levegőben lévő 15-20%-os konfidenciájú labdákat is felismerje!
  confidence_threshold: 0.15

  # IoU küszöb NMS-hez (Non-Maximum Suppression) – YOLOv10 ezt belülről kezeli
  iou_threshold: 0.45

  # Inferencia bemeneti méret (kisebb → gyorsabb, RTX 3050-en batch=2-vel >100 FPS)
  input_size: 640

  # Inferencia eszköz: "cuda:0" = GPU (RTX 3050), "cpu" = processzor
  device: "cuda:0"

  # ByteTrack konfiguráció (automatikus multi-object tracking)
  # KIKAPCSOLVA: model.track() stateful trackinget futtat és jelentős overhead-et okoz.
  # A 2D Kalman szűrő (kalman szekció lent) már elvégzi a simítást – ByteTrack felesleges.
  tracking:
    enabled: false
    tracker_config: "bytetrack.yaml"
    max_lost_frames: 15

  # ----- Kalman szűrő (2D per-camera simítás) -----
  kalman:
    enabled: true
    # Folyamaterrör (minél nagyobb, annál érzékenyebb az új mérésekre)
    # 0.05: gyorsabban követi a labda hirtelen irányváltozásait
    process_noise: 0.05
    # Mérési zaj (minél nagyobb, annál inkább bíz a predikciós modellben)
    # 0.05: jobban bízunk a YOLO mérésben (kevesebb simítás)
    measurement_noise: 0.05
    # Ennyi frame nélküli detektálás után nullázzuk a szűrőt
    # 5: gyorsabb újradetektálás elvesztett labda esetén
    max_coast_frames: 5

  # ----- Region of Interest (ROI) -----
  # Opcionális kép-terület szűrés. A kapus rendszernél kikapcsolva (enabled: false),
  # hogy a magasra lőtt/dobott (levegőben szálló) labdák is 100%-ban láthatóak legyenek.
  roi:
    enabled: false   # Kikapcsolva, hogy a levegőben lévő labdákat ne vágja le!
    # ROI koordináták (relatív, 0.0 – 1.0)
    x_min_rel: 0.0
    x_max_rel: 1.0
    y_min_rel: 0.0   # Teljes vertikális tartomány (0% = a kép legteteje)
    y_max_rel: 1.0   # (100% = a kép legalja)


# =============================================================================
# Trajektória előrejelzés
# =============================================================================
prediction:
  # Gravitáció (mm/s²) – Föld felszínén 9810 mm/s²
  gravity_mm_s2: 9810.0

  # Légellenállás koefficiense (dimenzió nélküli, 0 = nincs ellenállás)
  # 4-es Kipsta focilabda: kisebb és könnyebb, nagyobb drag/tömeg arány
  drag_coefficient: 0.0005

  # A Z=0 síkban (kapuvonalon) prediktáljuk az impact-pontot
  goal_plane_z_mm: 0.0

  # Minimum detektálási pontok száma a predikció előtt
  # (legalább N mérés kell a sebesség meghatározásához)
  min_points_for_prediction: 3

  # Trajektória történelem mérete (ennyi pontot tartunk meg)
  trajectory_history_size: 30

  # Predikciós megbízhatóság küszöb (ez alá nem mutatjuk a predikciót)
  min_confidence_threshold: 0.25

  # 3D Kalman szűrő trajektória simításhoz
  kalman_3d:
    process_noise: 1.0
    measurement_noise: 5.0   # mm-es mérési bizonytalanság


# =============================================================================
# Valódi lövés azonosítása
# =============================================================================
shot_detection:
  # A következő lövést a kezelő élesíti, ezért a háttérdetektálás nem számít lövésnek.
  manual_arm_required: true

  # A labdának ebben a távoli zónában kell először megjelennie.
  launch_z_min_mm: 5000.0
  launch_z_max_mm: 12000.0

  # A lövés csak elég hosszú, következetes és gyors kapu felé mozgás után igazolódik.
  min_travel_mm: 1000.0
  min_samples: 6
  min_speed_mm_s: 4000.0
  min_r2: 0.50

  # A labdának ténylegesen el kell érnie ezt a Z vonalat (mm) mielőtt a lövés megerősítésre kerül.
  # Ez kiszűri a hamis detektálásokat ahol a rendszer „lát" egy lövést ami még messze van,
  # de soha nem éri el ténylegesen a kaput. Alapértelmezés: 1500 mm (1.5 méter a kaputól).
  confirm_z_mm: 5000.0

  # A lövés MEGERŐSÍTÉSE alapból a labda MOZGÁSÁN múlik (gyors, konzisztens, kapu felé
  # tartó, a kaput ténylegesen elérő) – NEM a ballisztikus becsapódás-predikción.
  # Ok: a predikció "kapun belül" (in_goal) döntése a labda Y-koordinátáján múlik, ami
  # gyors lövésnél a sztereó Y-hiba (epipoláris eltérés, mozgáselmosódás) miatt sokszor
  # több méterrel elcsúszik (a logban X és Z helyes, Y viszont -2000..-45000 mm közé ugrik),
  # így minden valódi lövést tévesen elutasítana. Ha true, a régi szigorú in_goal feltételt
  # is megköveteljük (csak akkor kapcsold be, ha a magasság-mérés már megbízható).
  require_impact_in_goal: false

  # A lövés a kapu síkjánál vagy több elveszett mérés után lezárul.
  finish_z_mm: 700.0
  max_missing_frames: 4
  cooldown_s: 2.5

  # Automatikus élesítés mód: ha true, a lövés lezárása után automatikusan élesíti a következőt.
  # Teszteléshez hasznos, éles üzemben false ajánlott.
  auto_rearm: false


# =============================================================================
# Munkamenet perzisztencia
# =============================================================================
session:
  # Munkamenet fájlok mappája (automatikus JSON Lines mentés)
  session_dir: "data/sessions"
  # Automatikus mentés minden lövés után
  auto_save: true


# =============================================================================
# GUI megjelenítés
# =============================================================================
gui:
  # Ablak cím
  window_title: "DEIK Robot Foci Kapus – Vizualizációs Rendszer"

  # Alapértelmezett téma: "dark" | "light"
  theme: "dark"

  # GUI frissítési ráta (FPS) – monitorhoz korlátozzuk
  gui_fps_limit: 60

  # Kamera nézet bélyegkép mérete (a natív felbontás lekicsinyítve)
  camera_display_width: 960
  camera_display_height: 600

  # Overlay megjelenítési beállítások
  overlay:
    show_detection_box: true      # YOLO detektálási doboz
    show_ball_center: true        # Labda középpontja
    show_trajectory: true         # 2D trajektória overlay
    show_confidence: true         # Konfidencia érték
    show_tracking_id: true        # ByteTrack ID
    show_fps_counter: true        # FPS számláló
    show_3d_position: true        # 3D pozíció felirat

  # Kapu vizualizátor beállítások
  goal_view:
    show_impact_prediction: true  # Becsapódási pont
    show_shot_history: true       # Korábbi lövések
    max_shot_history: 15          # Maximum megőrzött lövés


# =============================================================================
# Naplózás (logging)
# =============================================================================
logging:
  # Napló szintje: "DEBUG" | "INFO" | "WARNING" | "ERROR"
  level: "INFO"

  # Napló fájl elérési útja (null = csak konzol)
  log_file: "data/goalkeeper.log"

  # Maximum napló fájl méret (MB)
  max_log_size_mb: 50

  # Megőrzött backup napló fájlok száma
  backup_count: 3
